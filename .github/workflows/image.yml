name: Docker-Image

# Bei jeder Version (Tag v…) baut GitHub das fertige Image für amd64 und arm64
# und veröffentlicht es in der GitHub Container Registry: ghcr.io/nimeyer22/immobilienverwalter
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  security:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sicherheits-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: immobilienverwalter:security-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=security-${{ matrix.arch }}

      - name: Trivy-Bericht erstellen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: immobilienverwalter:security-${{ matrix.arch }}
          format: json
          output: trivy-${{ matrix.arch }}.json
          exit-code: "0"

      - name: Critical-Findings mit Fix blockieren
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: immobilienverwalter:security-${{ matrix.arch }}
          format: table
          output: trivy-gate-${{ matrix.arch }}.txt
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

      - name: Scan-Berichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.arch }}
          path: |
            trivy-${{ matrix.arch }}.json
            trivy-gate-${{ matrix.arch }}.txt
          if-no-files-found: warn
          retention-days: 30

  image:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Anmelden bei der GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags festlegen (Version, Major.Minor, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nimeyer22/immobilienverwalter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Immobilienverwalter
            org.opencontainers.image.description=Nebenkostenabrechnung, Zähler, Belege und Ablage für Vermieter und WEG-Verwalter
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
